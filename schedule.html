<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание | Ритм Холл</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container header__container">
            <a href="index.html" class="logo">РИТМ ХОЛЛ</a>
            <nav class="nav"><ul class="nav__list">
                <li><a href="index.html" class="nav__link">Главная</a></li>
                <li><a href="styles.html" class="nav__link">Направления</a></li>
                <li><a href="schedule.html" class="nav__link nav__link--active">Расписание</a></li>
                <li><a href="teachers.html" class="nav__link">Педагоги</a></li>
                <li><a href="prices.html" class="nav__link">Цены</a></li>
                <li><a href="contacts.html" class="nav__link">Контакты</a></li>
            </ul></nav>
            <a href="contacts.html" class="btn btn--primary" data-event="contact_click" data-contact-type="header">Записаться</a>
        </div>
    </header>
    <main class="section">
        <div class="container">
            <h1 class="section__title">Расписание</h1>
            <div class="filters">
                <select id="filter-direction" data-event="schedule_filter" data-filter-type="direction">
                    <option value="all">Все направления</option>
                    <option value="hiphop">Хип-хоп</option>
                    <option value="heels">High Heels</option>
                    <option value="bachata">Бачата</option>
                </select>
            </div>
            <div class="schedule-list mt-20">
                <!-- Пример группы -->
                <div class="card mt-20">
                    <h3>Хип-хоп (с нуля)</h3>
                    <p>Пн, Ср 18:00–19:00</p>
                    <button class="btn btn--primary mt-20" data-event="class_select" data-class-id="hiphop-zero-mon" data-dance-style="hiphop" data-weekday="monday">Записаться</button>
                </div>
                <div class="card mt-20">
                    <h3>High Heels (базовый)</h3>
                    <p>Вт, Чт 20:00–21:00</p>
                    <button class="btn btn--primary mt-20" data-event="class_select" data-class-id="heels-base-tue" data-dance-style="heels" data-weekday="tuesday">Записаться</button>
                </div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container footer__container">
            <div class="footer__info"><p>ООО «Ритм Холл»</p><p>+7 (900) 919-19-91</p></div>
            <div class="footer__socials">
                <a href="#" data-event="social_click" data-page-section="footer" data-social="vk">ВКонтакте</a>
                <a href="#" data-event="social_click" data-page-section="footer" data-social="telegram">Telegram</a>
            </div>
        </div>
    </footer>
    <script src="js/analytics.js"></script>
</body>
</html>
